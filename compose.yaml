services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menewa
      POSTGRES_USER: menewa
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - menewa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menewa -d menewa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  menewa-postgres:
