spring:
  application:
    name: menewa-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/menewa}
    username: ${DATABASE_USERNAME:menewa}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
server:
  port: ${API_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
menewa:
  identity:
    bootstrap-admin-phone: ${IDENTITY_BOOTSTRAP_ADMIN_PHONE:}
    bootstrap-admin-name: ${IDENTITY_BOOTSTRAP_ADMIN_NAME:Administrateur Menewa}
    otp:
      dev-mode: ${OTP_DEV_MODE:true}
      secret: ${OTP_SECRET:menewa-local-development-secret-change-before-production}
      ttl: PT5M
      max-sends: 3
      send-window: PT10M
      max-attempts: 5
    session:
      ttl: P14D
