spring:
  application:
    name: menewa-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/menewa}
    username: ${DATABASE_USERNAME:menewa}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
server:
  port: ${API_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  writer-with-order-by-keys: true
  api-docs.version: openapi_3_0
  api-docs:
    path: /v3/api-docs
menewa:
  # Paiement en ligne Mobile Money. « simulated » : aucun argent ne circule, l'issue se choisit à l'écran (zone de test).
  payments:
    provider: ${PAYMENT_PROVIDER:simulated}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:menewa-local-payment-webhook-secret}
  storage:
    dir: ${STORAGE_DIR:./storage}
  catalog:
    seed-demo-data: ${CATALOG_SEED_DEMO_DATA:false}
  identity:
    bootstrap-admin-phone: ${IDENTITY_BOOTSTRAP_ADMIN_PHONE:}
    bootstrap-admin-name: ${IDENTITY_BOOTSTRAP_ADMIN_NAME:Administrateur Menewa}
    otp:
      dev-mode: ${OTP_DEV_MODE:true}
      # Numéros de démonstration (séparés par des virgules) dont le code reste affiché à l'écran, sans SMS. Vide en production.
      test-phones: ${OTP_TEST_PHONES:}
      secret: ${OTP_SECRET:menewa-local-development-secret-change-before-production}
      ttl: PT5M
      max-sends: 3
      send-window: PT10M
      max-attempts: 5
      # Limite par adresse IP sur une heure. Généreuse : au Togo, beaucoup d'abonnés mobiles partagent la même IP (CGNAT).
      max-requests-per-ip: ${OTP_MAX_REQUESTS_PER_IP:30}
      max-failures-per-ip: ${OTP_MAX_FAILURES_PER_IP:30}
      ip-window: PT1H
      retention: P1D
    session:
      ttl: P14D
