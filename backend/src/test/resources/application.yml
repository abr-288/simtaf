spring:
  datasource:
    url: jdbc:h2:mem:menewa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
springdoc:
  writer-with-order-by-keys: true
  api-docs.version: openapi_3_0
menewa:
  identity:
    otp:
      dev-mode: true
      secret: test-secret-for-otp-hashing
  storage:
    dir: ./build/test-storage
