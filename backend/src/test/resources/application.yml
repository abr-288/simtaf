spring:
  # Ce fichier remplace application.yml de production : reprendre ici les réglages nécessaires.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
springdoc:
  writer-with-order-by-keys: true
  api-docs.version: openapi_3_0
menewa:
  identity:
    maintenance-cron: "-"
    otp:
      dev-mode: true
      secret: test-secret-for-otp-hashing
      # Tous les tests partagent l'IP locale : limite par IP neutralisée ici, testée à part (IdentityProtectionTests).
      max-requests-per-ip: 1000000
      max-failures-per-ip: 1000000
  storage:
    dir: ./build/test-storage
  # Tâches planifiées coupées pendant les tests : chaque test les déclenche lui-même.
  sms:
    outbox-delay: PT1000H
    outbox-initial-delay: PT1000H
  giving:
    reminders-cron: "-"
